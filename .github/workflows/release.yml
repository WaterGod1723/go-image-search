name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: "386"
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -trimpath -ldflags "-s -w" -o "go-image-search-${{ github.ref_name }}-windows-${{ matrix.goarch }}.exe" .
          else
            go build -trimpath -ldflags "-s -w" -o "go-image-search-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}" .
          fi
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: |
          7z a "go-image-search-${{ github.ref_name }}-windows-${{ matrix.goarch }}.zip" "go-image-search-${{ github.ref_name }}-windows-${{ matrix.goarch }}.exe"
        shell: bash

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          tar -czf "go-image-search-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "go-image-search-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-image-search-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  publish:
    name: Publish Release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true