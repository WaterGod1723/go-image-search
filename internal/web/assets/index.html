<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8fb0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>图片搜索</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-theme="kawaii">

<!-- 背景装饰 -->
<div class="bg-deco" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="spark spark-1"></div>
  <div class="spark spark-2"></div>
  <div class="spark spark-3"></div>
</div>

<header class="nav">
  <button id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div class="nav-inner">
    <p id="nav-sub" class="nav-kicker">AI 图片检索</p>
    <h1 id="nav-title">搜索</h1>
  </div>
</header>

<main id="pages">

  <!-- ============ 搜索 ============ -->
  <section id="tab-search" class="page active">
    <div class="card">
      <div class="card-head">
        <span class="card-title">以图搜图</span>
        <span class="card-badge">🧸</span>
      </div>
      <div class="pick-row">
        <div id="dropzone" class="pick-zone">
          <div id="dz-placeholder" class="pick-placeholder">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="6"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-8 8"/></svg>
            </div>
            <p>选择图片</p>
            <span>点击或拖拽文件到此处</span>
          </div>
          <img id="query-preview" class="pick-preview" alt="查询图片预览">
        </div>
        <div id="pastezone" class="pick-zone">
          <div id="pz-placeholder" class="pick-placeholder">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </div>
            <p>粘贴图片</p>
            <span>Ctrl+V 粘贴剪贴板图片</span>
          </div>
          <img id="paste-preview" class="pick-preview" alt="粘贴图片预览">
        </div>
      </div>
      <p id="query-name" class="query-name"></p>
      <div class="query-actions">
        <button id="btn-search" class="btn" disabled>开始搜索</button>
        <div id="search-busy" class="busy" hidden>
          <div class="spinner"></div>
          <span>正在为你检索…</span>
        </div>
      </div>
      <input type="file" id="query-input" accept="image/*" hidden>
    </div>

    <div class="search-grid">
      <div class="search-left">
    <div class="card">
      <div class="card-head">
        <span class="card-title">检索参数</span>
        <span class="card-sub">微调你的匹配偏好</span>
      </div>
      <div class="cell">
        <label>返回数量</label>
        <div class="seg" id="seg-top">
          <button data-val="3">3</button>
          <button data-val="5" class="active">5</button>
          <button data-val="10">10</button>
          <button data-val="20">20</button>
        </div>
      </div>
      <div class="cell">
        <label>颜色权重</label>
        <span class="value" id="color-val">0.80</span>
      </div>
      <div class="cell slider-cell">
        <input type="range" id="color-range" min="0" max="1" step="0.05" value="0.8">
      </div>
      <div class="cell">
        <label>最大距离</label>
        <span class="value" id="maxdist-val">12</span>
      </div>
      <div class="cell slider-cell">
        <input type="range" id="maxdist-range" min="4" max="32" step="1" value="12">
      </div>
    </div>
    </div>

      <div class="search-right">
        <div id="results-empty" class="empty" hidden>
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/><path d="M8 12l2 2 3-4"/></svg>
          </div>
          <p>暂无匹配结果</p>
          <span>选择一张图片开始搜索</span>
        </div>
        <div id="results" class="results"></div>
      </div>
    </div>
  </section>

  <!-- ============ 图库 ============ -->
  <section id="tab-library" class="page">
    <div id="lib-empty" class="empty" hidden>
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-8 8"/></svg>
      </div>
      <p>图库还是空的</p>
      <span>先在“索引”页构建索引吧</span>
    </div>
    <div id="lib-grid" class="grid"></div>
  </section>

  <!-- ============ 索引 ============ -->
  <section id="tab-index" class="page">
  <div class="index-grid">
    <div class="index-left">
    <div class="card">
      <div class="card-head">
        <span class="card-title">基础配置</span>
        <span class="card-sub">索引的输入与输出</span>
      </div>
      <div class="cell">
        <label>图像库目录</label>
        <input id="cfg-dir" class="field field-right" placeholder="例如 D:\photos">
      </div>
      <div class="cell">
        <label>索引输出路径</label>
        <input id="cfg-out" class="field field-right" placeholder="index.bin">
      </div>
    </div>

    <div class="section-title">分段参数 · 可选</div>
    <div class="card">
      <div class="cell">
        <label>阈值分位数</label>
        <input id="cfg-thr" class="field field-right" type="number" step="0.05" min="0.01" max="1" value="0.85">
      </div>
      <div class="cell">
        <label>阈值因子</label>
        <input id="cfg-factor" class="field field-right" type="number" step="0.1" value="1.0">
      </div>
      <div class="cell">
        <label>最小区域比例</label>
        <input id="cfg-minarea" class="field field-right" type="number" step="0.0001" value="0.0006">
      </div>
      <div class="cell">
        <label>中值滤波核</label>
        <input id="cfg-median" class="field field-right" type="number" step="1" min="0" value="3">
      </div>
      <div class="cell">
        <label>连通性</label>
        <div class="seg" id="seg-conn">
          <button data-val="4" class="active">4</button>
          <button data-val="8">8</button>
        </div>
      </div>
    </div>

    <button id="btn-build" class="btn">构建索引</button>

    <div id="build-card" class="card build-card" hidden>
      <div class="build-row">
        <span id="build-label">准备中…</span>
        <span id="build-pct" class="value">0%</span>
      </div>
      <div class="progress"><div id="build-bar" style="width:0%"></div></div>
      <p id="build-file" class="build-file"></p>
    </div>
    </div>

    <div class="index-right">
    <div class="section-title">索引状态</div>
    <div class="card">
      <div class="cell"><label>加载状态</label><span id="st-load" class="value">-</span></div>
      <div class="cell"><label>图像数量</label><span id="st-images" class="value">-</span></div>
      <div class="cell"><label>区域数量</label><span id="st-regions" class="value">-</span></div>
      <div class="cell"><label>索引路径</label><span id="st-index" class="value value-wide">-</span></div>
      <div class="cell"><label>库根目录</label><span id="st-root" class="value value-wide">-</span></div>
    </div>

    <div class="section-title">加载已有索引</div>
    <div class="card">
      <div class="cell">
        <label>索引文件</label>
        <input id="cfg-load" class="field field-right" placeholder="index.bin">
      </div>
    </div>
    <button id="btn-load" class="btn secondary">加载索引</button>
    </div>
  </div>
  </section>

  <!-- ============ 调试 ============ -->
  <section id="tab-debug" class="page">
    <div class="card">
      <div class="cell">
        <label>图像路径</label>
        <input id="seg-path" class="field field-right" placeholder="D:\photos\a.png">
      </div>
    </div>

    <div class="section-title">分段参数 · 可选</div>
    <div class="card">
      <div class="cell">
        <label>阈值分位数</label>
        <input id="seg-thr" class="field field-right" type="number" step="0.05" min="0.01" max="1" value="0.85">
      </div>
      <div class="cell">
        <label>中值滤波核</label>
        <input id="seg-median" class="field field-right" type="number" step="1" min="0" value="3">
      </div>
      <div class="cell">
        <label>连通性</label>
        <div class="seg" id="seg-conn2">
          <button data-val="4" class="active">4</button>
          <button data-val="8">8</button>
        </div>
      </div>
    </div>

    <button id="btn-seg" class="btn">分析区域</button>

    <div id="seg-busy" class="busy" hidden><div class="spinner"></div><span>正在分析…</span></div>
    <p id="seg-info" class="seg-info"></p>
    <div id="seg-mode" class="seg seg-mode" hidden>
      <button data-val="bbox" class="active">边框</button>
      <button data-val="fill">填色</button>
    </div>
    <img id="seg-img" class="seg-img" alt="区域可视化" hidden>
    <div id="seg-tip" class="seg-tip" hidden></div>
    <div id="seg-regions" class="card cell-group" hidden></div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab active" data-tab="search">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
    <span>搜索</span>
  </button>
  <button class="tab" data-tab="library">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="6"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-8 8"/></svg>
    <span>图库</span>
  </button>
  <button class="tab" data-tab="index">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="9" cy="8" r="2.5"/><circle cx="15" cy="16" r="2.5"/></svg>
    <span>索引</span>
  </button>
  <button class="tab" data-tab="debug">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    <span>调试</span>
  </button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <img id="modal-img" alt="">
    <p id="modal-name"></p>
  </div>
</div>

<div id="toast"></div>

<script src="/assets/app.js"></script>
</body>
</html>
